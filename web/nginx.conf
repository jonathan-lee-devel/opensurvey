# Serves the Angular bundle and fronts the API, so the browser talks to one
# origin and nothing else in the compose stack needs publishing to the host.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # /api/<path> -> http://api:3000/<path>. The API has no global prefix, so the
    # trailing slash on proxy_pass strips /api. X-Forwarded-For carries the
    # client address; the API trusts this one hop (TRUST_PROXY=1) so its rate
    # limiter keys on the client rather than on this container.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles never change, so cache them for as long as allowed.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is a client-side route: hand it to Angular's index.html,
    # which must not be cached so a new deploy is picked up on reload.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
