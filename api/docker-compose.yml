# Local development database for the API. Tests do not use this; `yarn test:e2e`
# starts its own throwaway Postgres with Testcontainers.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opensurvey
      POSTGRES_PASSWORD: opensurvey
      POSTGRES_DB: opensurvey
    ports:
      # Host port 5433 so this does not clash with a Postgres already on 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opensurvey -d opensurvey']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
